[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconx"
version = "2.0.0"
description = "A fast, dependency-free port and surface scanner with risk classification and multi-format reporting."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nicholas Vormack" }]
keywords = ["security", "port-scanner", "reconnaissance", "network", "nmap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
reconx = "reconx.cli:main"

[project.gui-scripts]
reconx-gui = "reconx.gui:main"

[tool.setuptools.packages.find]
include = ["reconx*"]
